<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pagina protetta</title>
<style>
:root{--bg:#fafaf8;--card:#fff;--ink:#1d1f23;--mute:#6b7078;--line:#dcdcd6;--acc:#2a6fdb}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--card:#1f2226;--ink:#eceef1;--mute:#9aa0a8;--line:#33373d;--acc:#6aa3ff}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:360px}
h1{font-size:18px;margin:0 0 14px}
input[type=password]{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
label{display:block;margin:12px 0;font-size:14px;color:var(--mute)}
button{width:100%;padding:12px;font-size:16px;border:0;border-radius:10px;background:var(--acc);color:#fff}
#msg{min-height:1.3em;margin:10px 0 0;font-size:14px;color:#c0392b}
iframe{display:block;width:100%;height:100vh;height:100dvh;border:0}
</style>
</head>
<body>
<div id="gate">
<form id="f">
  <h1>Accesso</h1>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
  <label><input type="checkbox" id="rem"> Ricordami su questo dispositivo</label>
  <button type="submit">Apri</button>
  <p id="msg" role="alert"></p>
</form>
</div>

  var KEY = "grafico_pw";
  var msg = document.getElementById("msg");
  function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
  async function decrypt(pw){
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.s), iterations:P.i, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.n)}, key, b64(P.c));
    return new TextDecoder().decode(plain);
  }
  async function open(pw, remember, silent){
    if(!window.crypto || !crypto.subtle){
      msg.textContent = "Questo browser non supporta la decifratura: apri la pagina da https in Safari o Chrome.";
      return;
    }
    msg.style.color = ""; msg.textContent = "Decifro…";
    try{
      var html = await decrypt(pw);
      if(remember){ try{ localStorage.setItem(KEY, pw); }catch(e){} }
      document.body.innerHTML = "";
      var fr = document.createElement("iframe");
      fr.setAttribute("title", "Grafico di rischio");
      fr.srcdoc = html;
      document.body.appendChild(fr);
    }catch(e){
      try{ localStorage.removeItem(KEY); }catch(e2){}
      msg.style.color = "#c0392b";
      msg.textContent = silent ? "" : "Password errata.";
    }

  document.getElementById("f").addEventListener("submit", function(ev){

    open(document.getElementById("pw").value, document.getElementById("rem").checked, false);
